openapi: 3.0.0
info:
  title: Sentinel Community API
  version: 1.0.0
paths:
  /members:
    get:
      summary: Get list of community members
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
components:
  schemas:
    MemberResponse:
      type: object
      required:
        - id
        - name
        - university
      properties:
        id:
          type: string
        name:
          type: string
        university:
          type: string
